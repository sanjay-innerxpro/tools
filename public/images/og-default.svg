<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ToolBox - Free Online Media and File Tools</title>
  <desc id="desc">Scan media URLs, convert files, and use utility tools for free without signup.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0b4f4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="100" r="210" fill="#ffffff" opacity="0.08"/>
  <circle cx="190" cy="560" r="220" fill="#ffffff" opacity="0.08"/>

  <rect x="92" y="76" width="190" height="190" rx="38" fill="#ffffff" opacity="0.95"/>
  <rect x="126" y="112" width="122" height="122" rx="24" fill="#0f172a"/>
