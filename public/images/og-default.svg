  <text x="330" y="444" fill="#94a3b8" font-size="30" font-family="Segoe UI, Arial, sans-serif">No signup required</text>

  <rect x="330" y="486" width="312" height="68" rx="34" fill="url(#accent)"/>
  <text x="364" y="531" fill="#052e2b" font-size="32" font-family="Segoe UI, Arial, sans-serif" font-weight="700">toolbox.local</text>
